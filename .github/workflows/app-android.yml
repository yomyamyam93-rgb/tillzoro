# 안드로이드 앱: 화면이나 app/ 이 바뀌면 시험용 설치 파일(APK)을 만든다. Actions 탭의 실행 결과에서 내려받는다
name: app-android
on:
  push:
    branches: [main]
    paths: ["index.html", "tokens.css", "privacy.html", "terms.html", "app/**", ".github/workflows/app-android.yml"]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      # 같은 열쇠로 서명해야 다음 APK 가 기존 설치 위에 깔린다.
      # 서명이 다르면 안드로이드가 덮어쓰기를 거부하고, 지웠다 깔아야 해서 로그인도 날아간다
      - name: 서명 열쇠 준비
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tillzero.jks"
          ls -la "$RUNNER_TEMP/tillzero.jks"
      - name: 릴리스 APK
        env:
          TZ_KEYSTORE: ${{ runner.temp }}/tillzero.jks
          TZ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TZ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TZ_BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tillzero-android
          path: app/android/app/build/outputs/apk/release/app-release.apk
